name: Validar USA Work Kit sem publicar
on:
  push:
    branches: [usa-work-kit-2-protecao-local]
  pull_request:
    paths: ['usa-work-kit/**', 'server/**', 'tests/**', 'package*.json', 'schema.sql', 'wrangler*.jsonc']
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  native-browser-tests:
    needs: local-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/preventive-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preventive-browser-fictional-data
          path: qa-output/preventive-browser
