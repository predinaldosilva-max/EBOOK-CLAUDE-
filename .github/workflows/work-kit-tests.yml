name: Validar USA Work Kit sem publicar
on:
  push:
    branches: [usa-work-kit-2-protecao-local]
  pull_request:
    paths: ['usa-work-kit/**', 'server/**', 'tests/**', 'package*.json', 'schema.sql', 'wrangler*.jsonc']
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Three complete regression rounds
        run: |
          for round in 1 2 3; do
            QA_SEED=$round npm test || exit 1
          done
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  native-browser-tests:
    needs: local-tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/pwa-browser.cjs
      - run: node tests/preventive-browser.cjs
      - run: node tests/earnings-audit-browser.cjs
      - run: node tests/vault-browser-upgrade.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preventive-browser-fictional-data
          path: |
            qa-output/preventive-browser
            qa-output/earnings-audit-browser
            qa-output/vault-browser-upgrade
            qa-output/pwa-browser
