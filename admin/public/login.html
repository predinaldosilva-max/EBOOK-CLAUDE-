<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2923"><title>USA Work Kit Admin</title><link rel="stylesheet" href="/admin.css"></head><body><header><h1>USA Work Kit Admin</h1><label for="language" id="languageLabel">Idioma</label><select id="language"><option value="pt">Português</option><option value="es">Español</option><option value="en">English</option></select></header><main><section><h2 id="loginTitle"></h2><p id="loginHelp"></p><form id="login"><label for="user" id="userLabel"></label><input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="100" required><label for="password" id="passwordLabel"></label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><label for="code" id="codeLabel"></label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit" id="loginButton"></button></form><p id="recoveryHelp"></p></section></main><p id="status" role="status" aria-live="polite"></p><script src="/admin-i18n.js"></script><script src="/login.js"></script></body></html>
